[build]
  publish = "."

[[redirects]]
  from = "http://carloscalvo2590.com/*"
  to = "https://carloscalvo2590.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.carloscalvo2590.com/*"
  to = "https://carloscalvo2590.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.carloscalvo2590.com/*"
  to = "https://carloscalvo2590.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://carloscalvo2500.netlify.app/*"
  to = "https://carloscalvo2590.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sumate"
  to = "/alta-vendedor.html"
  status = 200

[[redirects]]
  from = "/panel"
  to = "/panel.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/videos/*.m4v"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
